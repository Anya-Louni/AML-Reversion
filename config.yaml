# AML differentiation reversion simulator: pipeline configuration.
# All paths are relative to the repository root.

seed: 0

paths:
  raw: data/raw
  processed: data/processed
  reports: reports
  figures: reports/figures

sources:
  vangalen:
    # van Galen et al. 2019 Cell, GEO GSE116256 (verified 2026-10-14, 73 MB tar)
    geo_tar: https://ftp.ncbi.nlm.nih.gov/geo/series/GSE116nnn/GSE116256/suppl/GSE116256_RAW.tar
  beataml:
    # Bottomly et al. 2022 Cancer Cell, open processed data, CC-BY-4.0
    # https://biodev.github.io/BeatAML2/  (files are Git LFS, served via github.com/.../raw/)
    base_url: https://github.com/biodev/beataml2.0_data/raw/main
    files:
      - beataml_waves1to4_sample_mapping.xlsx
      - beataml_wv1to4_clinical.xlsx
      - beataml_waves1to4_norm_exp_dbgap.txt
      - beataml_wes_wv1to4_mutations_dbgap.txt
      - beataml_probit_curve_fits_v4_dbgap.txt
      - beataml_drug_families.xlsx
      - beataml2_manuscript_vg_cts.xlsx
  lincs:
    # CMap LINCS 2020 metadata (public S3 used by clue.io)
    lincs2020_base: https://s3.amazonaws.com/macchiato.clue.io/builds/LINCS2020
    lincs2020_files: [siginfo_beta.txt, compoundinfo_beta.txt, cellinfo_beta.txt, geneinfo_beta.txt]
    # SigCom LINCS (Ma'ayan lab): per-signature characteristic-direction TSVs from LINCS 2020
    sigcom_api: https://maayanlab.cloud/sigcom-lincs/metadata-api
    sigcom_cp_library: 54198d6e-fe17-5ef8-91ac-02b425761653
    # GEO GSE92742 / GSE70138 metadata, kept for the census comparison only
    geo_meta:
      - https://ftp.ncbi.nlm.nih.gov/geo/series/GSE92nnn/GSE92742/suppl/GSE92742_Broad_LINCS_sig_info.txt.gz
      - https://ftp.ncbi.nlm.nih.gov/geo/series/GSE70nnn/GSE70138/suppl/GSE70138_Broad_LINCS_sig_info_2017-03-06.txt.gz
  hgnc:
    url: https://storage.googleapis.com/public-download-files/hgnc/tsv/tsv/hgnc_complete_set.txt

lincs:
  # Myeloid / leukemia lines preferred for signatures, in order of preference.
  # K562 is CML (erythroid-leaning), kept as a lower-priority hematopoietic line.
  myeloid_cell_lines: [HL60, THP1, SKM1, U937, NOMO1, MOLM13, MV411, OCIAML2, OCIAML3, KG1, NB4, CD34, K562]
  # Extra positive-control compounds downloaded even if absent from Beat AML.
  positive_controls: [tretinoin, enasidenib, ivosidenib, AGI-5198, AGI-6780, tamibarotene, alitretinoin, calcitriol, decitabine, azacitidine]
  # Max signatures per (drug, cell line) to download, ranked by quality flags.
  max_sigs_per_drug_cell: 6
  # For drugs without any myeloid signature, the core non-myeloid lines to use.
  fallback_cell_lines: [MCF7, PC3, A549, A375, HT29, HA1E, VCAP, HEPG2]

phase1:
  # Normal myeloid reference: van Galen cells called normal by the authors.
  cell_types: [HSC, Prog, GMP, ProMono, Mono, cDC]
  # Ordered main lineage used to check pseudotime and to build the maturation signature.
  lineage_order: [HSC, Prog, GMP, ProMono, Mono]
  include_aml_normal_cells: true
  qc: {min_genes: 200, max_pct_mt: 20, min_cells_per_gene: 10}
  n_hvg: 2000
  n_pcs: 30
  harmony_batch: sample
  min_batch_cells: 50         # smaller samples are pooled into one batch
  n_neighbors: 30
  n_root_candidates: 10       # root sensitivity: top-N HSC cells by the authors' Score_HSC
  palantir_waypoints: 1200
  score_clip_quantiles: [0.01, 0.99]
  landscape:
    grid: 160
    margin: 0.08
    bandwidth: 0.035           # fraction of embedding range
    weight_pseudotime: 0.75    # rest goes to -log density
  mapping: {k: 15, test_fraction: 0.2}
  signature_top_n: 200
  # Ribosomal-protein and mitochondrial genes are excluded from the primary signature: they track growth/size,
  # so a signature full of them would reward any antiproliferative drug. The full signature is kept as a variant.
  signature_exclude_regex: "^(RPL|RPS|MRPL|MRPS|MT-)"
  markers:
    stem: [CD34, PROM1]
    mature: [CD14, LYZ, CSF1R]

phase2:
  malignant_like_types: [HSC-like, Prog-like, GMP-like, ProMono-like, Mono-like, cDC-like]
  like_order: [HSC-like, Prog-like, GMP-like, ProMono-like, Mono-like]
  # Maturity threshold: score that best separates immature (HSC/Prog/GMP) from mature (ProMono/Mono/cDC)
  # normal reference cells (max balanced accuracy). Fixed here, before any drug is looked at.
  immature_types: [HSC, Prog, GMP]
  mature_types: [ProMono, Mono, cDC]
  min_cells_per_patient: 50          # patients below this are reported but flagged
  offmanifold_quantile: 0.99         # reference leave-one-out kNN distance quantile
  deconvolution:
    n_markers_per_type: 50
    min_mean_cpm: 5
    # Non-myeloid normal populations included so bulk samples are not forced into malignant types.
    normal_groups:
      T_NK: [T, CTL, NK]
      B: [B, Plasma, ProB]
      Ery: [earlyEry, lateEry]
      pDC: [pDC]
  mature_like_types: [ProMono-like, Mono-like, cDC-like]

phase3:
  # Wide screen: every compound with a signature in an AML / monocytic line, so positive controls are
  # ranked against a realistic background, not only against the Beat AML panel.
  wide_cell_lines: [THP1, HL60, U937, SKM1, NOMO1]
  wide_max_sigs_per_cell: 3
  # Lines whose consensus is preferred for scoring; others are used only when a drug lacks these.
  primary_lines: [THP1, HL60, U937, SKM1, NOMO1]
  secondary_lines: [CD34, K562]
  fallback_lines: [MCF7, PC3, A549, A375, HT29, HA1E, VCAP, HEPG2]
  gene_space: landmark_best_inferred      # sensitivity: landmark
  connectivity_set_size: 100
  # Positive controls, fixed before scoring. Tier 1 = canonical inducers of myeloid differentiation
  # in leukaemia lines (retinoids, vitamin D, PKC activators). Tier 2 = weaker or context-dependent evidence.
  positive_controls:
    tier1: [tretinoin, alitretinoin, isotretinoin, tamibarotene, AM-580, TTNPB, calcitriol, ingenol, ingenol-mebutate]
    tier2: [brequinar, leflunomide, sodium-butyrate, phenylbutyrate, valproic-acid, decitabine, azacitidine,
            tranylcypromine, enasidenib, ivosidenib, AGI-5198, AGI-6780]
  n_permutations: 10000

phase5:
  top_n_drugs: 8                  # per patient, from the patient's ranking (AML/monocytic-line signatures, named compounds)
  always_include: [tretinoin]     # positive control shown for every patient
  max_cells_per_patient: 300      # random subsample, fixed seed
  n_frames: 30
  # x' = x + alpha * s * sd_gene, s = drug consensus z-score; alpha rises linearly 0 -> alpha_max.
  # alpha_max is a visualization parameter, the same for every drug and patient.
  alpha_max: 1.0
  # Every drug's shift is rescaled to one common length, so the animation shows direction (what the
  # ranking scores), not raw LINCS magnitude. The length is the largest candidate that keeps, on average,
  # at most max_offmanifold_end of final-frame cells beyond the Phase 2 off-manifold cut.
  shift_norm_candidates: [2, 3, 4, 5, 6, 8, 10, 12]
  max_offmanifold_end: 0.2
